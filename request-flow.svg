<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Illustration of a service request moving from a student to a university office" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="380" fill="#eef3ef"/>

  <!-- student side -->
  <g fill="none" stroke="#1d5c43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="112" cy="128" r="26"/>
    <path d="M70 212c0-23 19-42 42-42s42 19 42 42"/>
    <rect x="74" y="232" width="76" height="52" rx="6"/>
    <path d="M90 250h44M90 264h30"/>
  </g>
  <text x="112" y="316" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#16241d">Student</text>

  <!-- request in transit -->
  <g fill="none" stroke="#a5801f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 190h210"/>
    <path d="M382 178l16 12-16 12"/>
    <rect x="254" y="140" width="76" height="52" rx="6" fill="#ffffff"/>
    <path d="M254 146l38 26 38-26"/>
  </g>
  <text x="292" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#4a5a52">One request</text>

  <!-- office side -->
  <g fill="none" stroke="#1d5c43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M428 250V150l84-46 84 46v100z"/>
    <path d="M428 250h168"/>
    <rect x="482" y="196" width="60" height="54" rx="4"/>
    <path d="M458 164h28M538 164h28M458 190h16M550 190h16"/>
  </g>
  <text x="512" y="316" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#16241d">Service office</text>
</svg>
